<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | New-Web-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  </head>
  <body>
    
    <div id="mainContainer">
      <div id="headerContainer">
        <div>GIGLANCER</div>
        <div>Dashoard</div>
      </div>
      <div id="appTitleContainer">
        <div>LIBRARY WEB APP</div>
      </div>
      <div id="bookContainer"></div>
      <div id="addBookFormContainer">
        <div>
          <div id="addBookHeader">ADD A NEW BOOK</div>
          <form>
            <div id="addBookInput">
              <label for="title"><span>*</span>Title :</label>
              <input type="text" name="title" id="title" minlength="2" maxlength="50" required>

              <label for="author"><span>*</span>Author's Name :</label>
              <input type="text" name="author" id="author" minlength="2" maxlength="50" required>

              <label for="pages"><span>*</span>No Of Pages :</label>
              <input type="number" name="pages" id="pages" min="10" max="5000" required>
            </div>
            <div id="addBookButton">
              <button type="submit" id="submit">ADD BOOK</button>
            </div>
          </form>
        </div>
      </div>
      <div id="footerContainer">Copyright© 2025<br>Created-BY: <i><b>JOHNTee...</b></i></div>
    </div>
    

    <script src="script.js"></script>
  </body>
</html>
